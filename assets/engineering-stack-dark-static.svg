<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="engineering-stack-title engineering-stack-description">
  <title id="engineering-stack-title">Alex engineering stack</title>
  <desc id="engineering-stack-description">A connected public toolchain: TypeScript and Node.js for building, pnpm and GitHub Actions for automation, and Vitest, Playwright, and Git for verification.</desc>
  <defs>
    <filter id="signal-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#A371F7" flood-opacity=".55"/></filter>
    <style>
      text { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .title { fill:#F0F6FC; font-size:24px; font-weight:700; letter-spacing:4px; }
      .subtitle,.group-label { fill:#8B949E; font-size:12px; font-weight:600; letter-spacing:2px; }
      .node-label { fill:#F0F6FC; font-size:12px; font-weight:600; }
      .primary-node > rect { stroke-width:2; }
      .primary-node .node-label { font-weight:700; }
      .primary-node > text:first-of-type { font-weight:800; }
      .mobile-only { display:none; }
      
      @media (max-width: 480px) {
        .desktop-only { display:none; }
        .mobile-only { display:inline; }
        .animated-node { animation-delay:var(--mobile-delay); }
        .title { font-size:28px; letter-spacing:2px; }
        .subtitle { font-size:21px; letter-spacing:1px; }
        .group-label { font-size:21px; letter-spacing:1px; }
        .node-label { font-size:21px; }
        .stack-group:nth-of-type(1) > rect { x:8px; y:96px; width:228px; height:188px; }
        .stack-group:nth-of-type(2) > rect { x:239px; y:96px; width:228px; height:188px; }
        .stack-group:nth-of-type(3) > rect { x:478px; y:96px; width:474px; height:188px; }
        .stack-group:nth-of-type(1) > .group-label { x:22px; y:112px; }
        .stack-group:nth-of-type(2) > .group-label { x:253px; y:112px; }
        .stack-group:nth-of-type(3) > .group-label { x:492px; y:112px; }
        .stack-node { transform:translate(var(--mobile-x), var(--mobile-y)); }
        .stack-node > rect { width:218px; height:70px; }
        .stack-node > text:first-of-type { font-size:16px; }
        .node-label-position { transform:translate(70px, 0); }
      }
      @media (max-width: 380px) {
        .title { y:42px; }
        .subtitle { y:78px; }
        .subtitle,.group-label,.node-label { font-size:27px; }
      }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="298" rx="22" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <text x="30" y="48" class="title">ENGINEERING STACK</text>
  <text x="30" y="75" class="subtitle">PUBLIC TOOLCHAIN · VERIFIED BY WORK</text>
  <g class="stack-group">
          <rect x="30" y="118" width="238" height="130" rx="18" fill="#10151D" stroke="#30363D"/>
          <text x="48" y="142" class="group-label">BUILD</text>
        </g><g class="stack-group">
          <rect x="282" y="118" width="266" height="130" rx="18" fill="#10151D" stroke="#30363D"/>
          <text x="300" y="142" class="group-label">AUTOMATE</text>
        </g><g class="stack-group">
          <rect x="562" y="118" width="368" height="130" rx="18" fill="#10151D" stroke="#30363D"/>
          <text x="580" y="142" class="group-label">VERIFY</text>
        </g>
  <path id="engineering-route-desktop" class="engineering-route desktop-only" d="M92 188 H872" fill="none" stroke="#4B5563" stroke-width="2"/>
  <path id="engineering-route-mobile" class="engineering-route mobile-only" d="M125 158 L125 239 L356 158 L356 239 L595 158 L835 158 L715 239" fill="none" stroke="#4B5563" stroke-width="2"/>
  <g class="stack-node primary-node" transform="translate(40 154)" style="--mobile-x:16px;--mobile-y:123px">
      <rect width="104" height="70" rx="14" fill="#10151D" stroke="#30363D"/>
      <circle cx="20" cy="22" r="10" fill="#3178C6" fill-opacity=".18"/>
      <text x="20" y="26" text-anchor="middle" fill="#3178C6" font-size="10" font-weight="700">TS</text>
      <g class="node-label-position"><text x="52" y="52" text-anchor="middle" class="node-label">TypeScript</text></g>
    </g><g class="stack-node primary-node" transform="translate(158 154)" style="--mobile-x:16px;--mobile-y:204px">
      <rect width="104" height="70" rx="14" fill="#10151D" stroke="#30363D"/>
      <circle cx="20" cy="22" r="10" fill="#3C873A" fill-opacity=".18"/>
      <text x="20" y="26" text-anchor="middle" fill="#3C873A" font-size="10" font-weight="700">JS</text>
      <g class="node-label-position"><text x="52" y="52" text-anchor="middle" class="node-label">Node.js</text></g>
    </g><g class="stack-node" transform="translate(298 154)" style="--mobile-x:247px;--mobile-y:123px">
      <rect width="104" height="70" rx="14" fill="#10151D" stroke="#30363D"/>
      <circle cx="20" cy="22" r="10" fill="#F69220" fill-opacity=".18"/>
      <text x="20" y="26" text-anchor="middle" fill="#F69220" font-size="10" font-weight="700">pn</text>
      <g class="node-label-position"><text x="52" y="52" text-anchor="middle" class="node-label">pnpm</text></g>
    </g><g class="stack-node" transform="translate(428 154)" style="--mobile-x:247px;--mobile-y:204px">
      <rect width="104" height="70" rx="14" fill="#10151D" stroke="#30363D"/>
      <circle cx="20" cy="22" r="10" fill="#2088FF" fill-opacity=".18"/>
      <text x="20" y="26" text-anchor="middle" fill="#2088FF" font-size="10" font-weight="700">GH</text>
      <g class="node-label-position"><text x="52" y="52" text-anchor="middle" class="node-label">GitHub Actions</text></g>
    </g><g class="stack-node" transform="translate(572 154)" style="--mobile-x:486px;--mobile-y:123px">
      <rect width="104" height="70" rx="14" fill="#10151D" stroke="#30363D"/>
      <circle cx="20" cy="22" r="10" fill="#729B1B" fill-opacity=".18"/>
      <text x="20" y="26" text-anchor="middle" fill="#729B1B" font-size="10" font-weight="700">Vi</text>
      <g class="node-label-position"><text x="52" y="52" text-anchor="middle" class="node-label">Vitest</text></g>
    </g><g class="stack-node" transform="translate(700 154)" style="--mobile-x:726px;--mobile-y:123px">
      <rect width="104" height="70" rx="14" fill="#10151D" stroke="#30363D"/>
      <circle cx="20" cy="22" r="10" fill="#2EAD33" fill-opacity=".18"/>
      <text x="20" y="26" text-anchor="middle" fill="#2EAD33" font-size="10" font-weight="700">Pw</text>
      <g class="node-label-position"><text x="52" y="52" text-anchor="middle" class="node-label">Playwright</text></g>
    </g><g class="stack-node" transform="translate(820 154)" style="--mobile-x:606px;--mobile-y:204px">
      <rect width="104" height="70" rx="14" fill="#10151D" stroke="#30363D"/>
      <circle cx="20" cy="22" r="10" fill="#F05032" fill-opacity=".18"/>
      <text x="20" y="26" text-anchor="middle" fill="#F05032" font-size="10" font-weight="700">G</text>
      <g class="node-label-position"><text x="52" y="52" text-anchor="middle" class="node-label">Git</text></g>
    </g>
  
</svg>
